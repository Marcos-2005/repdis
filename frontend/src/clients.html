<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepDis - Clientes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
    <div class="logo-container">
        <a href="index.html" class="logo-link">
            <img src="img/logo.jpg" alt="Logo RepDis" />
            <h1>RepDis</h1>
        </a>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="devices.html">Dispositivos</a></li>
        </ul>
    </nav>
</header>

<main id="main-content">
    <div class="client-page">
    <section class="list-section client-list-section">
        <h2>Lista de Clientes</h2>
        <div class="filters">
            <label>Buscar por nombre: <input type="text" id="filter-name" oninput="filterClients()"></label>
            <label>Buscar por teléfono: <input type="text" id="filter-phone" oninput="filterClients()"></label>
        </div>

        <table id="clients-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>DNI</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th>Dirección</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="clients-body"></tbody>
        </table>
        </div>
    </section>
    <section id="client-form-section" class="form-section hidden">
        <form id="client-form">
            <input type="hidden" id="client-id" />
            <fieldset>
                <legend>Datos del Cliente</legend>
                <label>Nombre: <input type="text" id="client-name" required /></label>
                <label>DNI: <input type="text" id="client-dni" required /></label>
                <label>Teléfono: <input type="text" id="client-phone" required /></label>
                <label>Email: <input type="email" id="client-email" /></label>
                <label>Dirección: <input type="text" id="client-address" /></label>
            </fieldset>
            <div class="form-buttons">
                <button type="button" onclick="saveClient()">Guardar</button>
            </div>
        </form>
    </section>
</main>

<script src="js/clients.js" defer></script>
</body>
</html>
