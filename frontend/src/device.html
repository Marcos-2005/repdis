<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepDis - Dispositivos</title>
    <link rel="stylesheet" href="css/device.css">
</head>
<body>
<header>
    <div class="logo-container">
        <a href="index.html" class="logo-link">
            <img src="img/logo.jpg" alt="Logo RepDis" />
            <h1>RepDis</h1>
        </a>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Órdenes</a></li>
            <li><a href="clients.html">Clientes</a></li>
        </ul>
    </nav>
</header>

<main id="main-content">
    <div class="client-page">
        <section class="list-section client-list-section">
            <h2>Lista de Dispositivos</h2>
            <div class="filters">
                <label>Buscar por Tipo: <input type="text" id="filter-name"></label>
                <label>Buscar por numero de serie: <input type="text" id="filter-phone"></label>
            </div>

            <table id="devices-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tipo</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Serie</th>
                    <th>Cliente</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody id="devices-body"></tbody>
            </table>
        </div>
        </section>

        <section id="device-form-section" class="form-section hidden">
            <form id="device-form">
                <input type="hidden" id="device-id" />
                <input type="hidden" id="device-client-id" />
                <fieldset>
                    <legend>Datos del Dispositivo</legend>
                    <label>Tipo: <input type="text" id="device-type" required /></label>
                    <label>Marca: <input type="text" id="device-brand" /></label>
                    <label>Modelo: <input type="text" id="device-model" /></label>
                    <label>Serie: <input type="text" id="device-serial" required /></label>
                    <label>Contraseña: <input type="text" id="device-password" /></label>
                    <label>Cliente: <input type="text" id="device-client-name" readonly /></label>
                </fieldset>
                <div class="form-buttons">
                    <button type="button" onclick="saveDevice()">Guardar</button>
                    <button type="button" class="cancel-button">Cancelar</button>

                </div>
            </form>
        </section>
</main>

<script src="js/devices.js" defer></script>
</body>
</html>
